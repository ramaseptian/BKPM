<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Mahasiswa</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f3f4f6; margin: 0; padding: 32px; color: #111827; }
        .kartu { max-width: 720px; margin: 0 auto; background: #fff; border-radius: 10px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        h1 { margin-top: 0; font-size: 1.4rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #e5e7eb; }
        th { background: #f9fafb; }
        #status { color: #6b7280; margin: 12px 0; }
        #status.galat { color: #b91c1c; }
    </style>
</head>
<body>
    <div class="kartu">
        <h1>Data Mahasiswa</h1>
        <p id="status"></p>
        <table id="tabel-mahasiswa">
            <thead><tr><th>NIM</th><th>Nama</th><th>Program Studi</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
    <script src="app.js"></script>
</body>
</html>
